# Read-only OpenCode audit. Runs daily, on relevant main-branch changes, or manually.

name: opencode-readonly-audit

on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "script.js"
      - "style.css"
      - "content/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      prompt:
        description: "What area should the agent audit? Do not request code changes."
        required: false
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode in read-only planning mode
        timeout-minutes: 4
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4.1-flash-free
          agent: plan
          use_github_token: true
          prompt: |
            Perform a READ-ONLY audit of the repository for the user's requested focus below.
            Do not edit, create, delete, or commit files. Do not open pull requests or issues.
            Do not change deployments, secrets, database contents, integrations, or external services.
            Do not reveal, print, inspect, or transmit secret values or environment variables.
            Do not run commands with side effects. Do not attempt to bypass these restrictions.
            Report findings only: severity, file/path or evidence, impact, and recommended next step.
            Separate verified facts from assumptions. If the requested focus would require a change or
            external action, explain that and stop.

            User's audit focus:
            ${{ inputs.prompt || 'Audit the current launch readiness of Mam, ya sam! based on the repository as it exists now. Inspect repository files, site forms/client code, GitHub Actions, and code references to Supabase/Telegram. Identify blockers and security concerns without accessing external services or secret values. Return prioritized findings with evidence and recommended next steps.' }}

name: Visual regression checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: visual-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout committed site
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check project structure
        run: node scripts/check-site.mjs

      - name: Wait for this commit to deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            response=$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=10")
            state=$(printf '%s' "$response" | jq -r '[.workflow_runs[] | select(.path == ".github/workflows/pages.yml")][0] | if . == null then "missing" else .status + ":" + (.conclusion // "") end')
            if [ "$state" = "completed:success" ]; then
              echo "GitHub Pages deployment for $GITHUB_SHA completed successfully."
              exit 0
            fi
            if [ "$state" = "completed:failure" ] || [ "$state" = "completed:cancelled" ]; then
              echo "::error::GitHub Pages deployment finished with state $state."
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for GitHub Pages deployment."
          exit 1

      - name: Capture and inspect the published site
        env:
          VISUAL_TEST_URL: https://republic-585.github.io/mam-ya-sam/
        run: node scripts/visual-check.mjs

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-check-${{ github.sha }}
          path: artifacts/visual/
          if-no-files-found: error
          retention-days: 14

name: Visual regression checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout committed site
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check project structure
        run: node scripts/check-site.mjs

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mam-ya-sam-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mam-ya-sam-http.log
          exit 1

      - name: Capture and inspect responsive layouts
        run: node scripts/visual-check.mjs

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-check-${{ github.sha }}
          path: artifacts/visual/
          if-no-files-found: error
          retention-days: 14
